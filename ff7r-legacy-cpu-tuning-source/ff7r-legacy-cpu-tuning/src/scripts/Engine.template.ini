; ======================================================================
;  FF7R Legacy CPU Tuning v{{VERSION}}
;  Final Fantasy VII Remake Intergrade - audio crackle + hitch fix for
;  older CPUs (AMD FX, Phenom II, early Intel quad-cores)
;
;  Generated {{DATE}} by Install-FF7RTuning.ps1 for this PC:
;    CPU   {{CPU_NAME}} ({{CORES}} threads)
;    GPU   {{GPU_NAME}} ({{VRAM_GB}} GB)
;    RAM   {{RAM_GB}} GB
;
;  Nothing here lowers visual quality. It changes how the engine schedules
;  audio mixing and asset streaming, not what it draws.
;  Requires FFVIIHook (Nexus mod 74) so the game reads this file.
;
;  Re-run "1 - Install (run once).bat" after a hardware change.
;  Hand edits are fine; re-running the installer overwrites them.
;
;  AUDIO DIALS
;   Sounds missing   -> raise AudioMaxChannels (+4 at a time, max 48)
;   Crackle remains  -> AudioCallbackBufferFrameSize 3072, or lower
;                       AudioMaxChannels by 4
;   Test live in the ~ console: au.SetAudioChannelCount 28
; ======================================================================

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; --- AUDIO -------------------------------------------------------------
; Crackle on older CPUs = the audio mixer missing its deadline while the
; CPU is busy rendering. The common "au.SetAudioChannelCount 0" fix hides
; it by muting sounds. This gives the mixer buffer headroom instead.
AudioSampleRate=48000
AudioCallbackBufferFrameSize={{AUDIO_BUFFER}}
AudioNumBuffersToEnqueue=4
AudioMaxChannels={{AUDIO_CHANNELS}}
AudioNumSourceWorkers={{AUDIO_WORKERS}}

[SystemSettings]
; --- IMAGE STABILITY ---------------------------------------------------
; On a CPU-limited PC, dynamic resolution blurs the image without saving
; the frame. Lock to full resolution.
r.DynamicRes.OperationMode=0

; --- STREAMING / HITCH FIX ---------------------------------------------
; Spreads texture and level loading across frames instead of bursts.
; Values adapted from ComplexRobot's stutter fix (Nexus mod 139).
; Pool size is picked from your VRAM ({{VRAM_GB}} GB).
r.Streaming.PoolSize={{POOL_SIZE}}
r.Streaming.MaxTempMemoryAllowed=100000
r.Streaming.AmortizeCPUToGPUCopy=1
r.Streaming.MaxNumTexturesToStreamPerFrame=4
r.Streaming.NumStaticComponentsProcessedPerFrame=4
r.Streaming.FramesForFullUpdate=1
r.Streaming.MinMipForSplitRequest=0
r.Streaming.HiddenPrimitiveScale=1

s.AsyncLoadingThreadEnabled=1
s.AsyncLoadingTimeLimit=0.1
s.LevelStreamingActorsUpdateTimeLimit=0.1
s.UnregisterComponentsTimeLimit=0.1
s.AsyncLoadingUseFullTimeLimit=0
; I/O cache sized from your system RAM ({{RAM_GB}} GB).
s.IoDispatcherCacheSizeMB={{IO_CACHE}}
s.LevelStreamingComponentsRegistrationGranularity=1
s.LevelStreamingComponentsUnregistrationGranularity=1
s.MaxIncomingRequestsToStall=1
s.MaxReadyRequestsToStallMB=0
s.MinBulkDataSizeForAsyncLoading=0
s.PriorityAsyncLoadingExtraTime=0

; Stock LOD behavior (0). Forcing max LOD (-15) on every crowd NPC costs
; older CPUs frames with no visible gain at normal distances.
r.MipMapLODBias=0
r.SkeletalMeshLODBias=0
r.LandscapeLODBias=0
r.ParticleLODBias=0
