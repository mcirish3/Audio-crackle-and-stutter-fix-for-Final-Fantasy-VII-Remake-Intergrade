name: release

# Builds the release zip with build.sh and publishes a GitHub release.
# Run it from the Actions tab (release -> Run workflow), or push a tag like v1.0.1.
# The version comes from the VERSION file; hyphenated versions are pre-releases.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh
      - name: Release notes from CHANGELOG
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          awk -v v="$V" '$0 ~ "^## "v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Smooth Midgar $V" > notes.md
          printf '\n**Install:** extract the zip anywhere and run `1 - Install (run once).bat`, then press Play in Steam. Requires [FFVIIHook](https://www.nexusmods.com/finalfantasy7remake/mods/74). See the README for details.\n' >> notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; case "$VERSION" in *-*) PRE="--prerelease";; esac
          gh release create "v$VERSION" dist/Smooth-Midgar-v$VERSION.zip \
            --title "Smooth Midgar $VERSION" --notes-file notes.md --target "$GITHUB_SHA" $PRE
